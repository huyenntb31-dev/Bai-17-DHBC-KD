                slotIdx++;
            }
            slotsContainer.appendChild(wordDiv);
        });

        // Gen Keyboard
        let letters = keywordNoSpace.split('');
        const alphabet = "AĂÂBCDĐEÊGHIKLMNOÔƠPQRSTUƯVXY";
        for(let i=0; i<5; i++) letters.push(alphabet[Math.floor(Math.random() * alphabet.length)]);
        letters.sort(() => Math.random() - 0.5);

        const keyboard = document.getElementById('keyboard');
        letters.forEach((char, idx) => {
            const btn = document.createElement('button');
            btn.className = 'keyboard-btn game-font';
            btn.innerText = char;
            btn.id = 'key-' + idx;
            btn.onclick = () => {
                playSfx(clickAudio);
                const emptyIdx = currentAnswer.findIndex(v => v === null);
                if(emptyIdx === -1) return;
                
                currentAnswer[emptyIdx] = { char, btnId: btn.id };
                document.getElementById('slot-'+emptyIdx).innerText = char;
                document.getElementById('slot-'+emptyIdx).classList.add('filled');
                btn.classList.add('hidden-btn');
                
                if(!currentAnswer.includes(null)) {
                    const ans = currentAnswer.map(v => v.char).join('');
                    if(ans === keywordNoSpace) {
                        setTimeout(() => { 
                            playSfx(winAudio); 
                            
                            // Hiệu ứng tung hoa
                            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#fde047', '#38bdf8', '#a855f7', '#4ade80'] });
                            
                            // Cộng điểm
                            let scoreElem = document.getElementById('scoreDisplay');
                            let currentScore = parseInt(scoreElem.innerText) || 0;
                            scoreElem.innerText = currentScore + 10;

                            alert('🎉 CHÍNH XÁC! Bạn được +10 điểm! Tuyệt vời!'); 
                        }, 200);
                    } else {
                        setTimeout(() => alert('Sai rồi! Hãy bấm nút Xóa để thử lại!'), 200);
                    }
                }
            };
            keyboard.appendChild(btn);
        });

        function handleBackspace() {
            let lastIdx = -1;
            for(let i=currentAnswer.length-1; i>=0; i--) {
                if(currentAnswer[i] !== null) { lastIdx = i; break; }
            }
            if(lastIdx === -1) return;
            
            playSfx(clickAudio);
            const data = currentAnswer[lastIdx];
            document.getElementById(data.btnId).classList.remove('hidden-btn');
            currentAnswer[lastIdx] = null;
            document.getElementById('slot-'+lastIdx).innerText = '';
            document.getElementById('slot-'+lastIdx).classList.remove('filled');
        }
    </script>
</body>
</html>
